<div class="max-w-md mx-auto py-10">
    <div class="bg-white border border-zinc-200 rounded-lg shadow-sm p-6">
        
        <div class="mb-6">
            <h2 class="text-lg font-semibold tracking-tight text-zinc-900">Change Password</h2>
            <p class="text-sm text-zinc-500">Enter your new password below to update your account.</p>
        </div>

        <form method="post" class="space-y-4">
            {% csrf_token %}
            
            <div class="space-y-1.5">
                <label class="text-sm font-medium text-zinc-700">New Password</label>
                <input type="password" 
                       name="pass1" 
                       placeholder="••••••••" 
                       required 
                       class="flex h-10 w-full rounded-md border border-zinc-200 bg-white px-3 py-2 text-sm ring-offset-white placeholder:text-zinc-500 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-zinc-950 focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50 transition-all">
            </div>

            <div class="space-y-1.5">
                <label class="text-sm font-medium text-zinc-700">Confirm New Password</label>
                <input type="password" 
                       name="pass2" 
                       placeholder="••••••••" 
                       required 
                       class="flex h-10 w-full rounded-md border border-zinc-200 bg-white px-3 py-2 text-sm ring-offset-white placeholder:text-zinc-500 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-zinc-950 focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50 transition-all">
            </div>

            <div class="pt-2">
                <button type="submit" 
                        class="w-full inline-flex items-center justify-center rounded-md bg-zinc-900 px-4 py-2 text-sm font-medium text-white shadow hover:bg-zinc-800 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-zinc-950 transition-colors cursor-pointer">
                    Update Password
                </button>
            </div>
        </form>
        
    </div>
</div>
