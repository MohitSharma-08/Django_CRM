{% extends 'core/base.html' %}
{% block content %}
<div class="flex items-center justify-center min-h-[75vh]">
    <div class="w-full max-w-md bg-white rounded-xl shadow p-6">
        <h2 class="text-xl font-bold mb-4">Verify OTP</h2>
        <form method="post">
            {% csrf_token %}
            <input type="text" name="otp" placeholder="Enter OTP" required
                   class="w-full px-4 py-3 border rounded mb-4">
            <button type="submit" class="w-full bg-teal-600 text-white py-3 rounded">
                Verify
            </button>
        </form>
    </div>
</div>
{% endblock %}
