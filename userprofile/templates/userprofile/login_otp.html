{% extends "core/base.html" %}
{% block title %}Login with OTP{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[85vh] px-4 py-12">
    <div class="w-full max-w-md bg-white border border-zinc-200 rounded-lg shadow-sm p-8 sm:p-10">

        <div class="flex flex-col space-y-2 text-center mb-8">
            <h1 class="text-2xl font-bold tracking-tight text-zinc-950">
                Login with OTP
            </h1>
            <p class="text-sm text-zinc-500">
                Enter your registered email to receive a one-time password
            </p>
        </div>

        <form method="post" class="space-y-6" x-data="{ loading: false }" @submit="loading = true">
            {% csrf_token %}

            <div class="space-y-2">
                <label class="text-sm font-medium leading-none text-zinc-800">
                    Email address
                </label>
                <input
                    type="email"
                    name="email"
                    required
                    placeholder="you@example.com"
                    class="flex h-10 w-full rounded-md border border-zinc-200 bg-white px-3 py-2 text-sm ring-offset-white placeholder:text-zinc-500 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-zinc-950 focus-visible:ring-offset-2 transition-all outline-none"
                >
            </div>

            <button
                type="submit"
                :disabled="loading"
                class="inline-flex items-center justify-center w-full h-10 px-4 py-2 bg-zinc-900 hover:bg-zinc-800 disabled:opacity-70 disabled:cursor-not-allowed text-white text-sm font-medium rounded-md transition-all shadow focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-zinc-950 focus-visible:ring-offset-2 cursor-pointer active:scale-[0.98]"
            >
                <svg x-show="loading" class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" x-cloak>
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span x-text="loading ? 'Sending OTP...' : 'Send OTP'"></span>
            </button>
        </form>

        <div class="mt-8 text-center pt-6 border-t border-zinc-100">
            <p class="text-sm text-zinc-500">
                Remembered your password? 
                <a href="{% url 'login' %}" class="font-semibold text-zinc-950 hover:underline underline-offset-4 decoration-zinc-300">
                    Login with password
                </a>
            </p>
        </div>

    </div>
</div>
{% endblock %}
