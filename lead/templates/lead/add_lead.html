{% extends 'core/base.html' %}

{% block title %}Add Lead{% endblock %}

{% block content %}

<div class="py-6 px-6">
    <h1 class="text-xl">Add Lead</h1>

    <form method="post" action=".">
        {% csrf_token %}

        {{ form.as_p}}

        <button class="mt-4 py-4 px-8 bg-teal-500 text-white rounded-xl">Submit</button>

        <a href="{% url 'leads_list' %}"
        class="mt-4 py-4 px-8 bg-red-500 text-white rounded-xl">
            Cancel
        </a>
    </form>
</div>

{% endblock %}
